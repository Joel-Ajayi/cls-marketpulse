# Global cert-manager, please go get an SSL for <my.domain> and www.<my.domain> and put the keys in my namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ appNamespace }}-tls"
  namespace: "{{ appNamespace }}"
spec:
  secretName: "{{ tlsSecretName }}" # Secret resource name that will be created to store the TLS certificate and private key.
  issuerRef:
    name: "{{ tlsIssuerName }}"
    kind: ClusterIssuer
  dnsNames:
    - "{{ domainName }}"
